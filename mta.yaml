_schema-version: 3.3.0
ID: defectresolution
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: defectresolution-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    properties:
      STARTUP_DEFECT_IDS: "8000420387"
      ADDITIONAL_ABAP_PROGRAMS: "ZRMM_PO_EXPEDITING_REPORT"
      LLM_MODEL_NAME: "gpt-5.5"
      MAX_TOKENS: "100000"
      MAX_ATTACHMENT_TEXT_CHARS: "100000"
      RESOURCE_GROUP: "default"
      EMAIL_DESTINATION: wbg_lmail
      EMAIL_TO: mchandradas@worldbankgroup.org
      EMAIL_FROM: mchandradas@worldbankgroup.org
      EMAIL_TLS_REJECT_UNAUTHORIZED: "false"
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: defectresolution-auth
      - name: defectresolution-destination
      - name: defectresolution-connectivity
      - name: defectresolution-aicore
      - name: defectresolution-objectstore

resources:
  - name: defectresolution-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: defectresolution-${space}
        tenant-mode: dedicated
  - name: defectresolution-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: defectresolution-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: defectresolution-aicore
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-name: aria-aicore
      service-plan: extended
  - name: defectresolution-objectstore
    type: org.cloudfoundry.managed-service
    parameters:
      service: objectstore
      service-name: azureobjectstore
      service-plan: standard
