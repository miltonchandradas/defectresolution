_schema-version: 3.3.0
ID: defectresolution
description: A simple CAP project.
version: 1.0.0
modules:
- name: defectresolution-srv
  type: nodejs
  path: gen/srv
  properties:
    ADDITIONAL_ABAP_PROGRAMS: ""
    EMAIL_DESTINATION: wbg_lmail
    EMAIL_FROM: mchandradas@worldbankgroup.org
    EMAIL_TLS_REJECT_UNAUTHORIZED: "false"
    EMAIL_TO: mchandradas@worldbankgroup.org
    LLM_MODEL_NAME: gpt-5.5
    MAX_ATTACHMENT_TEXT_CHARS: "100000"
    MAX_TOKENS: "100000"
    RESOURCE_GROUP: default
    STARTUP_DEFECT_IDS: "8000420387"
  requires:
  - name: defectresolution-auth
  - name: defectresolution-destination
  - name: defectresolution-connectivity
  - name: defectresolution-aicore
  - name: defectresolution-objectstore
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: defectresolution-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: defectresolution-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - defectresolutionui.zip
      name: defectresolutionui
      target-path: resources/
- name: defectresolutionui
  type: html5
  path: app/defectresolutionui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: defectresolution-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: defectresolution-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: defectresolution-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
- name: defectresolution-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
- name: defectresolution-aicore
  type: org.cloudfoundry.managed-service
  parameters:
    service: aicore
    service-name: aria-aicore
    service-plan: extended
- name: defectresolution-objectstore
  type: org.cloudfoundry.managed-service
  parameters:
    service: objectstore
    service-name: azureobjectstore
    service-plan: standard
- name: defectresolution-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: defectresolution-html5-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
